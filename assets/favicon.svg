<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <title>OpenBubble</title>
  <style>
    .ink   { fill: #1a1717; }
    .soft  { fill: #9a9595; }
    .highlight { fill: #fdfcfc; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #f4efee; }
      .soft  { fill: #6b6666; }
      .highlight { fill: #201d1d; }
    }
  </style>

  <!-- "ob" monogram in the same pixel style as the wordmark -->
  <g class="soft">
    <!-- o -->
    <rect x="2"  y="14" width="22" height="4"/>
    <rect x="2"  y="30" width="22" height="4"/>
    <rect x="2"  y="14" width="4"  height="20"/>
    <rect x="20" y="14" width="4"  height="20"/>
  </g>
  <g class="ink">
    <!-- b -->
    <rect x="28" y="6"  width="4"  height="32"/>
    <rect x="28" y="14" width="16" height="4"/>
    <rect x="28" y="30" width="16" height="4"/>
    <rect x="40" y="14" width="4"  height="20"/>
  </g>
</svg>
